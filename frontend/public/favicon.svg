<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1A1A1A"/>
      <stop offset="100%" style="stop-color:#2A2A2A"/>
    </linearGradient>
    <linearGradient id="gold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#F0C87A"/>
      <stop offset="50%" style="stop-color:#D4A843"/>
      <stop offset="100%" style="stop-color:#B8862A"/>
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="6" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <filter id="softglow">
      <feGaussianBlur stdDeviation="12" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Rounded square background -->
  <rect width="512" height="512" rx="110" ry="110" fill="url(#bg)"/>

  <!-- Subtle warm glow behind icon -->
  <ellipse cx="256" cy="270" rx="160" ry="130" fill="#D4A843" opacity="0.07" filter="url(#softglow)"/>

  <!-- Heart shape (main) -->
  <path d="M256 370 C256 370 110 285 110 190 C110 150 140 120 180 120 C210 120 235 138 256 158 C277 138 302 120 332 120 C372 120 402 150 402 190 C402 285 256 370 256 370Z"
    fill="url(#gold)" filter="url(#glow)" opacity="0.95"/>

  <!-- Child silhouette inside heart (simplified, clean) -->
  <!-- Head -->
  <circle cx="256" cy="175" r="22" fill="#1A1A1A"/>
  <!-- Body -->
  <path d="M238 197 Q256 248 274 197 L274 240 Q256 255 238 240Z" fill="#1A1A1A"/>

  <!-- Small d-pad style gaming dots (bottom right of heart) -->
  <circle cx="316" cy="272" r="8" fill="#1A1A1A" opacity="0.8"/>
  <circle cx="296" cy="252" r="6" fill="#1A1A1A" opacity="0.6"/>
  <circle cx="336" cy="252" r="6" fill="#1A1A1A" opacity="0.6"/>
  <circle cx="316" cy="232" r="6" fill="#1A1A1A" opacity="0.6"/>

  <!-- Thin gold border stroke on heart -->
  <path d="M256 370 C256 370 110 285 110 190 C110 150 140 120 180 120 C210 120 235 138 256 158 C277 138 302 120 332 120 C372 120 402 150 402 190 C402 285 256 370 256 370Z"
    fill="none" stroke="#F0C87A" stroke-width="2" opacity="0.3"/>
</svg>